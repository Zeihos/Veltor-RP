# Nginx: include this in EACH virtual host's server{} block.
# Use separate document roots for the site and forum:
# /var/www/veltor/site and /var/www/veltor/forum.
# .htaccess does not work with Nginx.
location ~* ^/(?:app|storage)(?:/|$) { return 403; }
location ~ /\\.(?!well-known/) { return 403; }
location ~* \\.(?:db|sqlite3?|sql|lock|log|bak|old|tmp|env|ini)$ { return 403; }
# Configure PHP-FPM via your hosting provider and serve only index.php/install.php.
# Enforce HTTPS, disable directory listing, and back up storage OUTSIDE web root.
